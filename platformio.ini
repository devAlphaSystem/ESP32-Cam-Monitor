[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
extra_scripts = post:scripts/preserve_nvs_upload.py

build_flags =
    -DCORE_DEBUG_LEVEL=3

monitor_filters =
    time
    esp32_exception_decoder
